[package]
name = "oxide-cli"
description = "Headless CLI tool for Oxide EDA: CI/CD ERC/DRC validation, CAM release generation, and netlist extraction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "oxide-cli"
path = "src/main.rs"

[[bin]]
name = "generate_benchmarks"
path = "src/bin/generate_benchmarks.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
oxide-types = { path = "../oxide-types" }
oxide-net = { path = "../oxide-net" }
oxide-rules = { path = "../oxide-rules" }
oxide-output = { path = "../oxide-output" }
oxide-physics = { path = "../oxide-physics" }
oxide-altium-importer = { path = "../oxide-altium-importer" }
oxide-ai = { path = "../oxide-ai" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true }

[lints]
workspace = true
