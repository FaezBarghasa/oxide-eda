[package]
name = "oxide-library-server"
description = "axum HTTP+WS server for Oxide database-flavour libraries (v0.9.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxide-library = { workspace = true }
actix-web = { workspace = true }
actix-cors = { workspace = true }
quinn = { workspace = true, optional = true }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[features]
default = []
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn"]

[dev-dependencies]
# Re-import oxide-library with the `database` feature so the in-tree integration
# tests can construct a `DatabaseAdapter` against an in-process server.
oxide-library = { workspace = true, features = ["database"] }
tokio = { workspace = true }
reqwest = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

# GH #548 — inherit [workspace.lints.rust] (unused_must_use = deny).
[lints]
workspace = true
