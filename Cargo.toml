[workspace]
resolver = "2"
members = [
    "crates/oxide-app",
    "crates/oxide-engine",
    "crates/oxide-bom",
    "crates/oxide-types",
    "crates/oxide-gfx",
    "crates/oxide-renderer",
    "crates/oxide-widgets",
    "crates/oxide-erc",
    "crates/oxide-erc-dsl",
    "crates/oxide-net",
    "crates/oxide-output",
    "crates/chrome-catalog",
    "crates/oxide-library",
    "crates/oxide-library-server",
    "crates/oxide-sketch",
    "crates/oxide-bake",
    "crates/oxide-3d-model-importer",
    "crates/oxide-physics",
    "crates/oxide-rules",
    "crates/oxide-router",
    "crates/oxide-ai",
    "crates/oxide-compute",
]
# A bare `cargo build` / `cargo test` at the root only builds the daily-
# driver crates. The library server and the chrome-catalog dev sandbox are
# still built explicitly with `-p oxide-library-server` / `-p chrome-catalog`.
default-members = [
    "crates/oxide-app",
    "crates/oxide-engine",
    "crates/oxide-types",
    "crates/oxide-erc",
    "crates/oxide-erc-dsl",
    "crates/oxide-net",
    "crates/oxide-output",
    "crates/oxide-library",
    "crates/oxide-sketch",
    "crates/oxide-bake",
    "crates/oxide-3d-model-importer",
    "crates/oxide-bom",
    "crates/oxide-gfx",
    "crates/oxide-renderer",
    "crates/oxide-widgets",
    "crates/oxide-physics",
    "crates/oxide-rules",
    "crates/oxide-router",
    "crates/oxide-ai",
    "crates/oxide-compute",
]

[workspace.package]
version = "0.15.0"
edition = "2024"
# MSRV tracks the pinned toolchain (`rust-toolchain.toml` channel). We build,
# test, and support exactly one toolchain — the pinned stable — so the declared
# minimum equals what CI actually enforces rather than an older, untested floor.
# (Edition 2024 needs 1.85 and let-chains need 1.88; both are well below this.)
# When bumping, keep `rust-toolchain.toml`, the CI `dtolnay/rust-toolchain@<ver>`
# refs, and this line in lockstep.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/alplabai/signex"

[workspace.dependencies]
# UI framework
iced = { version = "0.14", features = ["wgpu", "canvas", "advanced", "svg", "image", "tokio"] }
iced_aw = { version = "0.13", default-features = false, features = [
    "tabs", "tab_bar", "card", "context_menu", "number_input",
    "color_picker", "menu", "drop_down", "selection_list",
    "wrap", "spinner", "sidebar", "labeled_frame", "badge",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Identity
uuid = { version = "1.23.1", features = ["v4", "v7", "serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# File dialogs
rfd = "0.17.2"

# DSL parser
chumsky = "0.12"
regex = "1"

# Output generation
pdf-writer = "0.14"
rust_xlsxwriter = "0.77"
tiny-skia = "0.11"
ttf-parser = "0.25"

# Internal crates
oxide-types = { path = "crates/oxide-types" }
oxide-engine = { path = "crates/oxide-engine" }
oxide-bom = { path = "crates/oxide-bom" }
oxide-gfx = { path = "crates/oxide-gfx" }
oxide-renderer = { path = "crates/oxide-renderer" }
oxide-widgets = { path = "crates/oxide-widgets" }
oxide-erc = { path = "crates/oxide-erc" }
oxide-erc-dsl = { path = "crates/oxide-erc-dsl" }
oxide-net = { path = "crates/oxide-net" }
oxide-output = { path = "crates/oxide-output" }
oxide-3d-model-importer = { path = "crates/oxide-3d-model-importer" }
oxide-physics = { path = "crates/oxide-physics" }
oxide-rules = { path = "crates/oxide-rules" }
oxide-router = { path = "crates/oxide-router" }
oxide-ai = { path = "crates/oxide-ai" }
oxide-compute = { path = "crates/oxide-compute" }

# Library subsystem (v0.9 plan, restored at v0.11)
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

# Library subsystem — Phase 1 (adapters: local-git, database server, distributor APIs, search, AI-stub)
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
keyring = "3"
tantivy = "0.22"
# NOTE: oauth2 is declared directly in oxide-library (it needs
# default-features = false + the reqwest-blocking feature set, which cannot
# be expressed by inheriting a workspace entry). No crate inherits an
# `oauth2.workspace = true`, so a root entry here would be dead weight that
# could silently drift from the real one — intentionally omitted.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "macros", "chrono", "uuid", "migrate"] }
pdf-extract = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace", "auth", "validate-request", "limit"] }
# Per-IP rate limiting for the library server (HI-2). Closes the DoS surface
# on `/locks` (unbounded acquire) + mutating routes. `governor` is the
# underlying token-bucket impl.
tower_governor = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal — library
oxide-library = { path = "crates/oxide-library" }

# Internal — sketcher (v0.13)
oxide-sketch = { path = "crates/oxide-sketch" }

# Internal — bake pipeline (v0.13 Phase 7)
oxide-bake = { path = "crates/oxide-bake" }

# Inherited by every member via `[lints] workspace = true` (GH #548).
[workspace.lints.rust]
# `iced::Task` is `#[must_use]` (iced_runtime-0.14.0/src/task.rs), so a bare
# `self.open_project_file(path)?;` that drops one already made rustc fire —
# at WARN level, in a build that emits dozens of unrelated warnings. The
# discard in #544 reached a PR anyway. Signal buried in noise is not a gate.
#
# This catches strictly more than scripts/check_discarded_tasks.sh can: any
# must-use type, any method name, any line wrapping. It does NOT replace
# that script — rustc counts `let _ = ...` as "used", so the `let _ =`
# discard shape stays the grep gate's job.
unused_must_use = "deny"

# Deliberately NOT lifted here: clippy's `let_underscore_must_use`, which
# `oxide-app` carries locally. Workspace-wide it fires 27 times outside
# that crate — oxide-output 17 (netlist/mod.rs, svg/document.rs), oxide-gfx
# 7 (debug_pass/), oxide-types 3 (atomic_io.rs) — none of them `Task`
# discards, and #548's whole complaint is that signal buried in noise is not
# a gate. Measured on d6c5531e with `--force-warn`, production targets only.
# An earlier version of this comment said 33 and listed oxide-library; that
# count was wrong and oxide-library contributes none (#577). The 27 sit in
# three clusters rather than scattered, so lifting the lint here is more
# tractable than "33 across four crates" suggested — revisit after #533.
#
# `oxide-app` therefore keeps explicit `[lints.*]` tables instead of
# `workspace = true`. A lint added above does NOT reach it automatically —
# it must be hand-copied into crates/oxide-app/Cargo.toml at the same
# level, which scripts/check_lint_lockstep.sh now fails CI over (#570).

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
